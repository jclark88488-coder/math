<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATH95</title><style>*{box-sizing:border-box}body{margin:0;background:#008080;font:15px Tahoma,'MS Sans Serif',sans-serif}.window{background:silver;border:3px outset #fff;min-height:100dvh;padding:3px}.bar{background:navy;color:#fff;padding:6px;font-weight:bold;display:flex;justify-content:space-between}.menu{padding:8px 5px}.screen{background:#061a0b;color:#80ff9b;border:3px inset #ddd;padding:16px;min-height:155px}.screen small{font:12px monospace}.question{font:bold clamp(28px,7vw,54px) monospace;text-align:center;padding:16px 0}.tools{display:flex;flex-wrap:wrap;gap:8px;padding:10px 3px}select,button,input{font:inherit}button,select{background:#ddd;border:2px outset white;padding:7px 10px;cursor:pointer}button:active{border-style:inset}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:8px 2px}.answers button{min-height:55px;font:bold 23px monospace}.correct{background:#a9e8ac!important}.wrong{background:#f4b8b8!important}.footer{padding:10px 4px;font-size:13px}.feedback{min-height:28px;padding:8px;font-weight:bold}.score{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}</style><div class="window"><div class="bar"><span>▣ MATH95.EXE — Math Facts</span><span>_ □ ×</span></div><div class="menu">File　Practice　Help</div><div class="tools"><label>Facts: <select id="kind"><option value="multiply">Multiplication</option><option value="divide">Division</option><option value="add">Addition</option><option value="subtract">Subtraction</option><option value="mixed">Mixed Review</option></select></label><label>Level: <select id="level"><option value="easy">Starter</option><option value="medium" selected>Grade 3</option><option value="hard">Challenge</option></select></label><button id="reset">New Session</button></div><div class="screen"><small>C:\MATH95&gt; READY</small><div class="question" id="question" aria-live="polite">7 × 8 = ?</div><div class="score"><small id="count">QUESTION 1</small><small id="points">SCORE 0 / 0</small></div></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite">Choose an answer!</div><div class="tools"><button id="reveal">Reveal Answer</button><button id="next">Next Fact →</button></div><div class="footer">✓ Classroom-friendly · No ads · No accounts · Runs offline · Answers are randomly generated</div></div><script>const $=id=>document.getElementById(id);let questionNumber=0,correctCount=0,attempted=0,answer=0,locked=false;const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function build(){let type=$('kind').value;if(type==='mixed')type=['multiply','divide','add','subtract'][rand(0,3)];const level=$('level').value,max=level==='easy'?5:level==='medium'?10:12;let a=rand(1,max),b=rand(1,max),symbol='×';if(type==='multiply'){answer=a*b;symbol='×'}if(type==='divide'){answer=a;symbol='÷';a=a*b}if(type==='add'){a=rand(level==='easy'?1:10,level==='hard'?999:99);b=rand(1,level==='easy'?20:level==='hard'?999:99);answer=a+b;symbol='+'}if(type==='subtract'){a=rand(level==='easy'?5:20,level==='hard'?999:199);b=rand(1,a);answer=a-b;symbol='−'}$('question').textContent=`${a} ${symbol} ${b} = ?`;questionNumber++;locked=false;$('feedback').textContent='Choose an answer!';$('count').textContent=`QUESTION ${questionNumber}`;let opts=new Set([answer]);let spread=type==='add'||type==='subtract'?20:10;while(opts.size<4){let n=answer+rand(-spread,spread);if(n>=0)opts.add(n)}let arr=[...opts].sort(()=>Math.random()-.5);$('answers').replaceChildren(...arr.map(n=>{let btn=document.createElement('button');btn.textContent=n;btn.onclick=()=>choose(n,btn);return btn}));update()}function update(){$('points').textContent=`SCORE ${correctCount} / ${attempted}`}function finish(){locked=true;for(let btn of $('answers').children){btn.disabled=true;if(+btn.textContent===answer)btn.classList.add('correct')}}function choose(n,btn){if(locked)return;attempted++;if(n===answer){correctCount++;$('feedback').textContent='✓ CORRECT! Great thinking!'}else{btn.classList.add('wrong');$('feedback').textContent=`Not quite. The answer is ${answer}.`}finish();update()}$('reveal').onclick=()=>{if(locked)return;$('feedback').textContent=`ANSWER: ${answer} — discuss how you know!`;finish()};$('next').onclick=build;$('reset').onclick=()=>{questionNumber=0;correctCount=0;attempted=0;build()};$('kind').onchange=$('reset').onclick;$('level').onchange=$('reset').onclick;build();</script></html>
